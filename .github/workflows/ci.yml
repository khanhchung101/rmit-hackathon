name: mock-regression-not-tide
on: [push, pull_request]
jobs:
  mock-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run validate:fixtures
      - run: npm run security
      - run: echo 'MOCK regression only. Does NOT prove real Tide policy-gated signing.'
